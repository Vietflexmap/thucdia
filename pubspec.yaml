name: vietflex_thucdia
description: Offline-first Vietflex Field GIS platform for mobile field survey and WebGIS workflows.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.2.2
  flutter_map_mbtiles: ^1.0.4
  flutter_map_pmtiles: ^1.0.5
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  provider: ^6.1.5
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  file_picker: ^10.3.3
  share_plus: ^11.1.0
  image_picker: ^1.2.0
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
