name: Unpack clean-room source

on:
  push:
    branches:
      - clean-room-fieldgis-v0.1

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand source bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f source_bundle.part1 || exit 0
          cat source_bundle.part1 source_bundle.part2 source_bundle.part3 source_bundle.part4 source_bundle.part5 > source_bundle.tar.gz
          tar -xzf source_bundle.tar.gz --strip-components=1
          rm -f source_bundle.part1 source_bundle.part2 source_bundle.part3 source_bundle.part4 source_bundle.part5 source_bundle.tar.gz
          rm -f .github/workflows/unpack-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add clean-room field GIS v0.1 source"
          git push
