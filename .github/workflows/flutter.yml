name: Flutter CI

on:
  push:
  pull_request:

jobs:
  analyze-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform shell
        run: flutter create . --platforms=android --org com.vietflexmap --project-name vietflex_thucdia
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build debug APK
        run: flutter build apk --debug
