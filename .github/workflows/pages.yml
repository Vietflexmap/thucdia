name: Deploy Field WebGIS

on:
  push:
    branches: [main]
    paths:
      - "webgis/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and validate WebGIS runtime
        run: |
          cat webgis/src/app.part-* > webgis/app.js
          echo "742a816db91339cdac6cd5386eeeb32f41e9e139d475fd63913d1754b8a5eeaf  webgis/app.js" | sha256sum -c -
          cp webgis/app.js /tmp/vietflex-fieldgis.mjs
          node --check /tmp/vietflex-fieldgis.mjs
          node --check webgis/sw.js
          python -m json.tool webgis/manifest.webmanifest > /dev/null
          rm -rf webgis/src

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webgis
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
